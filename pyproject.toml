[project]
name = "django-iam-dbauth"
version = "1.0.0"
description = "Django database backends to use AWS Database IAM Authentication"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lab Digital", email = "opensource@labdigital.nl" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=5.2",
    "boto3",
    "dnspython"
]

[project.urls]
Homepage = "https://github.com/labd/django-iam-dbauth"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "coverage>=7.6.1",
    "pretend>=1.0.9",
    "psycopg2>=2.9.9",
    "mysqlclient>=2.2.4",
    "pytest-mock>=3.14.0",
    "pytest-django>=4.8.0",
    "moto>=5.0.13",
    { include-group = "lint" },
]
lint = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/django_iam_dbauth"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
